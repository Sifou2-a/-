<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>معلومات الجهاز</title>
<style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
  padding: 30px;
}
button {
  padding: 12px 20px;
  cursor: pointer;
}
pre {
  white-space: pre-wrap;
  direction: ltr;
  text-align: left;
}
</style>
</head>
<body>
<h1>معلومات الجهاز</h1>
<p>ستظهر معلومات تقنية أساسية عن جهازك بعد موافقتك.</p>
<button onclick="showInfo()">أوافق وأعرض معلومات جهازي</button>
<pre id="info"></pre>

<script>
function showInfo() {
  const info = {
    browser: navigator.userAgent,
    language: navigator.language,
    screen: screen.width + " x " + screen.height,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    platform: navigator.platform
  };

  document.getElementById("info").textContent =
    JSON.stringify(info, null, 2);
}
</script>
</body>
</html>
